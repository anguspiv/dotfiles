# =====================================================
# TMUX Configuration - Optimized for Productivity
# Enhanced with improved statusline and chezmoi integration
# =====================================================

# Create new session if none exists
new-session -d -n $HOST

# =====================================================
# CORE SETTINGS
# =====================================================

# History and performance
set -g history-limit 50000
set -sg escape-time 0
set -g repeat-time 500
set -g focus-events on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Terminal and colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Enable ligature support for WezTerm and Ghostty
set -ga terminal-overrides ',wezterm*:Tc:sitm=\E[3m'
set -ga terminal-overrides ',ghostty*:Tc:sitm=\E[3m'
set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh -l"

# Mouse support
set -g mouse on

# Clipboard integration
set -g set-clipboard on

# =====================================================
# KEYBINDINGS
# =====================================================

# Prefix remains default (C-b)
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Kill panes/windows without confirmation
bind x kill-pane
bind X kill-window

# Copy mode (Vi-style)
setw -g mode-keys vi
bind ` copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# macOS clipboard integration
bind y run "tmux save-buffer - | pbcopy"

# Kiro CLI integration (if available)
bind q split-window -h -c "#{pane_current_path}" "kiro-cli"
bind Q split-window -v -c "#{pane_current_path}" "kiro-cli"

# =====================================================
# STATUS BAR - Enhanced Development Workflow
# =====================================================

# Status bar settings optimized for performance
set -g status-position bottom
set -g status-interval 10          # Balanced refresh rate
set -g status-justify left         # Left-align like Spaceship prompt
set -g status-left-length 150      # More space for full paths
set -g status-right-length 150

# Nordic color scheme - Starship inspired (minimal & fast)
set -g status-style 'bg=#2e3440,fg=#d8dee9'

# Left side: All-in-one with icons on left (Starship style)
set -g status-left '#(~/.tmux/scripts/status_left_starship.sh "#{pane_current_path}")'

# Window list - Starship minimalist style
setw -g window-status-format '#[fg=#616e88]#I:#W '
setw -g window-status-current-format '#[fg=#88c0d0,bold]#I:#W '
setw -g window-status-separator '  '

# Right side: All-in-one for consistent spacing (Starship style)
set -g status-right '#(~/.tmux/scripts/status_right_starship.sh)'

# Performance optimizations
set -g status-left-style bg=#2e3440
set -g status-right-style bg=#2e3440

# Pane borders
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#88c0d0'

# Message styling
set -g message-style 'bg=#88c0d0,fg=#2e3440,bold'
set -g message-command-style 'bg=#88c0d0,fg=#2e3440,bold'

# =====================================================
# PLUGINS
# =====================================================

# Essential plugins only (minimal set to avoid TPM errors)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'

# =====================================================
# PLUGIN SETTINGS
# =====================================================

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Battery settings
set -g @batt_icon_status_charged '🔋'
set -g @batt_icon_status_charging '⚡'
set -g @batt_icon_status_discharging '🔋'

# =====================================================
# ADDITIONAL OPTIMIZATIONS
# =====================================================

# Reduce default command delay
set -g display-panes-time 2000
set -g display-time 2000

# Automatically set window title
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#T - #W'

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# =====================================================
# CONDITIONAL CONFIG LOADING
# =====================================================

# Load SteamOS-specific config if it exists
if-shell "test -f ~/.tmux.steamos.conf" "source ~/.tmux.steamos.conf"

# =====================================================
# TPM INITIALIZATION (keep at bottom)
# =====================================================
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
