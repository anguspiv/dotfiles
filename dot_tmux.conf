# =====================================================
# TMUX Configuration - Optimized for Productivity
# =====================================================

# Create new session if none exists
new-session -d -n $HOST

# =====================================================
# CORE SETTINGS
# =====================================================

# History and performance
set -g history-limit 50000
set -sg escape-time 0
set -g repeat-time 500
set -g focus-events on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Terminal and colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Enable ligature support for WezTerm and Ghostty
set -ga terminal-overrides ',wezterm*:Tc:sitm=\E[3m'
set -ga terminal-overrides ',ghostty*:Tc:sitm=\E[3m'
set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh -l"

# Mouse support
set -g mouse on

# Clipboard integration
set -g set-clipboard on

# =====================================================
# KEYBINDINGS
# =====================================================

# Prefix remains default (C-b)
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Kill panes/windows without confirmation
bind x kill-pane
bind X kill-window

# Copy mode (Vi-style)
setw -g mode-keys vi
bind ` copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# macOS clipboard integration
bind y run "tmux save-buffer - | pbcopy"

# =====================================================
# STATUS BAR - Enhanced Development Workflow
# =====================================================

# Status bar settings optimized for performance
set -g status-position bottom
set -g status-interval 10          # Reduced refresh rate for performance
set -g status-justify centre       # Center window list
set -g status-left-length 100
set -g status-right-length 120

# Nordic color scheme with segment definitions
set -g status-style 'bg=#2e3440,fg=#88c0d0'

# Left side: Session + Directory + Node Version (Powerline segments)
set -g status-left '\
#[bg=#5e81ac,fg=#2e3440,bold] #S \
#[bg=#4c566a,fg=#5e81ac,nobold]\
#[bg=#4c566a,fg=#88c0d0] #{=20:pane_current_path} \
#[bg=#81a1c1,fg=#4c566a]\
#[bg=#81a1c1,fg=#2e3440] #(~/.tmux/scripts/node_version_cross.sh) \
#[bg=#2e3440,fg=#81a1c1]\
#[bg=#2e3440] '

# Window list in center (managed by status-justify centre)
setw -g window-status-format '#[bg=#3b4252,fg=#88c0d0] #I:#W '
setw -g window-status-current-format '\
#[bg=#88c0d0,fg=#2e3440,bold] #I:#W \
#[bg=#3b4252,fg=#88c0d0,nobold]'
setw -g window-status-separator ''

# Right side: Chezmoi + Network + Battery + System + Time (Powerline segments)
set -g status-right '\
#(~/.tmux/scripts/chezmoi_status.sh)\
#[bg=#2e3440,fg=#4c566a]\
#[bg=#4c566a,fg=#88c0d0] #(~/.tmux/scripts/network_status_cross.sh) \
#[bg=#4c566a,fg=#5e81ac]\
#[bg=#5e81ac,fg=#2e3440] #(~/.tmux/scripts/battery_status_cross.sh) \
#[bg=#5e81ac,fg=#81a1c1]\
#[bg=#81a1c1,fg=#2e3440] #(~/.tmux/scripts/system_stats_cross.sh) \
#[bg=#81a1c1,fg=#88c0d0]\
#[bg=#88c0d0,fg=#2e3440,bold] %H:%M \
#[bg=#88c0d0,fg=#8fbcbb]\
#[bg=#8fbcbb,fg=#2e3440] %m/%d '

# Performance optimizations
set -g status-left-style bg=#2e3440
set -g status-right-style bg=#2e3440

# Pane borders
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#88c0d0'

# Message styling
set -g message-style 'bg=#88c0d0,fg=#2e3440,bold'
set -g message-command-style 'bg=#88c0d0,fg=#2e3440,bold'

# =====================================================
# PLUGINS
# =====================================================

# Essential plugins only (minimal set to avoid TPM errors)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'

# =====================================================
# PLUGIN SETTINGS
# =====================================================

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Battery settings  
set -g @batt_icon_status_charged '🔋'
set -g @batt_icon_status_charging '⚡'
set -g @batt_icon_status_discharging '🔋'

# =====================================================
# ADDITIONAL OPTIMIZATIONS
# =====================================================

# Reduce default command delay
set -g display-panes-time 2000
set -g display-time 2000

# Automatically set window title
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#T - #W'

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# =====================================================
# TPM INITIALIZATION (keep at bottom)  
# =====================================================
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'