# =====================================================
# TMUX Configuration - Optimized for Productivity
# Enhanced with improved statusline and chezmoi integration
# =====================================================

# =====================================================
# CORE SETTINGS
# =====================================================

# History and performance
set -g history-limit 50000
set -sg escape-time 0
set -g repeat-time 500
set -g focus-events on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Terminal and colors
set -g default-terminal "tmux-256color"

# Tell tmux that the outer terminal (Ghostty) supports RGB true color and extended keys
set -as terminal-features ",xterm-*:RGB"
set -as terminal-features ",xterm-*:extkeys"

# OSC 8 hyperlinks (Claude Code prints clickable file paths). Scoped to Ghostty
# so mosh clients, which drop OSC 8, are unaffected.
set -as terminal-features ",xterm-ghostty:hyperlinks"

# Claude Code allow lets notifications and progress updates reach the outer terminal instead of being swallowed by tmux
set -g allow-passthrough on

# Extended keys: pass modifier combos (Shift+Enter, etc.) through to applications
set -s extended-keys on
set -s extended-keys-format csi-u

# Fallback for other terminals that use 256col naming
set -ga terminal-overrides ",*256col*:Tc"

# Enable ligature and italic support for Ghostty
set -ga terminal-overrides ',xterm-*:Tc:sitm=\E[3m'

# Undercurl support (colored underlines in Neovim diagnostics, etc.)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh"

# Mouse support
set -g mouse on

# Clipboard integration
set -g set-clipboard on

# =====================================================
# KEYBINDINGS
# =====================================================

# Prefix remains default (C-b)
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Kill panes/windows without confirmation
bind x kill-pane
bind X kill-window

# Copy mode (Vi-style)
setw -g mode-keys vi
bind ` copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# macOS clipboard integration
bind y run "tmux save-buffer - | pbcopy"

# =====================================================
# STATUS BAR - Enhanced Development Workflow
# =====================================================

# Status bar settings optimized for performance
set -g status-position bottom
set -g status-interval 10          # Balanced refresh rate
set -g status-justify centre       # Center the window list
set -g status-left-length 150      # More space for full paths
set -g status-right-length 220     # room for the Claude agent segment

# Nordic color scheme - Starship inspired (minimal & fast)
set -g status-style 'bg=#2e3440,fg=#d8dee9'

# Left side: All-in-one with icons on left (Starship style)
set -g status-left '#(~/.tmux/scripts/status_left_starship.sh "#{pane_current_path}")'

# Window list - Starship minimalist style with separators and icons
# Using window icon  (U+F2D0) to indicate windows section
setw -g window-status-format '#[fg=#616e88] #I #W'
setw -g window-status-current-format '#[fg=#88c0d0,bold] #I #W'
setw -g window-status-separator ' #[fg=#4c566a] '

# Right side: All-in-one for consistent spacing (Starship style)
# Claude Code panes across all sessions (agent_status.sh), then the usual segments
set -g status-right '#(~/.tmux/scripts/agent_status.sh)#(~/.tmux/scripts/status_right_starship.sh)'

# Performance optimizations
set -g status-left-style bg=#2e3440
set -g status-right-style bg=#2e3440

# Pane borders
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#88c0d0'

# Message styling
set -g message-style 'bg=#88c0d0,fg=#2e3440,bold'
set -g message-command-style 'bg=#88c0d0,fg=#2e3440,bold'

# =====================================================
# PLUGINS
# =====================================================

# Essential plugins only (minimal set to avoid TPM errors)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-continuum'

# =====================================================
# PLUGIN SETTINGS
# =====================================================

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# Bring Claude Code back in each restored pane, resuming that directory's last conversation
set -g @resurrect-processes '"~claude->claude --continue"'

# Continuum: autosave every 15 min, restore on tmux server start
set -g @continuum-restore 'on'

# vim-tmux-navigator: treat Claude Code like vim, so Ctrl+J (newline) and
# Ctrl+K reach it instead of moving panes. Use prefix + h/j/k/l from Claude panes.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|claude)(diff)?(-wrapped)?'

# Battery settings
set -g @batt_icon_status_charged '🔋'
set -g @batt_icon_status_charging '⚡'
set -g @batt_icon_status_discharging '🔋'

# =====================================================
# ADDITIONAL OPTIMIZATIONS
# =====================================================

# Reduce default command delay
set -g display-panes-time 2000
set -g display-time 2000

# Automatically set window title
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#T - #W'

# Bell monitoring, not activity: Claude Code's spinner counts as activity and
# flagged every agent window permanently. A bell (Claude's terminal_bell
# notification) marks only the windows that actually need input.
setw -g monitor-activity off
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# =====================================================
# TPM INITIALIZATION (keep at bottom)
# =====================================================
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
