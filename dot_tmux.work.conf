# Work-specific Tmux Configuration

# Work session templates
bind W run-shell "tmux-work-session main"
bind S run-shell "tmux-work-session services"
bind L run-shell "tmux-work-session logs"

# Work-specific key bindings
bind M command-prompt -p "Meeting notes:" "run-shell 'tmux split-window -v -p 30 \"${EDITOR:-nvim} ~/work/notes/meeting-$(date +%%Y-%%m-%%d)-%%%.md\"'"

# Quick work project switcher
bind P command-prompt -p "Project:" "run-shell 'cd ~/work/%% && tmux rename-window %%'"
