# Personal-specific Tmux Configuration

# Personal session templates
bind D run-shell "tmux-personal-session dev"
bind P run-shell "tmux-personal-session project"
bind E run-shell "tmux-personal-session learning"

# Learning notes quick access
bind N command-prompt -p "Learn about:" "run-shell 'tmux split-window -v -p 30 \"${EDITOR:-nvim} ~/learning/notes/%%-$(date +%%Y-%%m-%%d).md\"'"

# Quick project switcher
bind O command-prompt -p "Project:" "run-shell 'cd ~/projects/%% && tmux rename-window %%'"
