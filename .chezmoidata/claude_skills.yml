# Claude Code skills installed by chezmoi.
# Only skills that are deliberately used belong here. Plugin-provided skills
# are owned by their plugins and must not be listed.

claude_skills:
  base_skills:
    # obra/superpowers - development workflow
    - brainstorming
    - dispatching-parallel-agents
    - executing-plans
    - finishing-a-development-branch
    - receiving-code-review
    - requesting-code-review
    - subagent-driven-development
    - systematic-debugging
    - test-driven-development
    - using-git-worktrees
    - using-superpowers
    - verification-before-completion
    - writing-plans
    - writing-skills
    # anthropics/skills - official skills.
    # This marketplace ships BUNDLES, not individually-installable skills, so
    # these are plugin names rather than skill names. Listing the skills
    # themselves (docx, pdf, ...) fails with "not found in any configured
    # marketplace" - there is no per-skill plugin to install.
    #   document-skills = docx, pdf, pptx, xlsx
    #   example-skills  = canvas-design, doc-coauthoring, internal-comms,
    #                     mcp-builder, webapp-testing, plus algorithmic-art,
    #                     brand-guidelines, frontend-design, skill-creator,
    #                     slack-gif-creator, theme-factory, web-artifacts-builder
    # Bundles are the unit of installation; the extras come along unavoidably.
    - document-skills
    - example-skills
  work_specific_skills: []
