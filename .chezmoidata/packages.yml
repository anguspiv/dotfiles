packages:
  darwin:
    core:
      taps: []
      brews:
        # Modern bash for this repo's own scripts (#!/usr/bin/env bash).
        # macOS ships bash 3.2, where scripts/init-roundtrip-check.sh dies on
        # "RUN[@]: unbound variable" - the empty-array-under-set-u bug fixed in
        # bash 4.4. CI is unaffected (ubuntu has bash 5); this is for local runs.
        - bash
        - bat
        - chezmoi
        - curl
        - eza
        - fd
        - fnm
        - fzf
        - gh
        - git
        - git-delta
        - git-extras
        - gitleaks
        - glow
        - jq
        - lazygit
        - mas
        - neovim
        - pinentry-mac
        - pnpm
        - proton-pass-cli
        - reattach-to-user-namespace
        - ripgrep
        - starship
        - tmux
        - tmuxinator
        - tpm
        - uv
        - wget
        - zoxide
        - zplug
        - zsh-syntax-highlighting
      casks:
        - claude-code
        - font-monaspice-nerd-font
        - font-victor-mono-nerd-font
        - ghostty
        - google-chrome
        - obsidian
        - zed
      mas:
        - name: "In Your Face"
          id: 1476964367

    light:
      taps: []
      brews: []
      casks:
        - brave-browser
        # Claude desktop app. Per-profile rather than core so it stays off work
        # machines. The app self-updates (Squirrel); the bundle runs with
        # --no-upgrade, so brew only ensures presence and never races it.
        - claude
        - slack
        - tailscale-app
        - zoom
      mas: []

    personal:
      taps:
        - int128/kubelogin
      brews:
        - autoenv
        - awscli
        - chroma
        - helm
        - k9s
        - kubernetes-cli
        - int128/kubelogin/kubelogin
        - pgcli
        # Version-pinned to match what is installed. The tmux status line uses
        # python3 opportunistically (it is guarded by `command -v`, so its
        # absence only drops a segment), but python3 is wanted on this machine
        # in its own right and would not survive a rebuild undeclared.
        # Bumping to a newer series is a deliberate edit here.
        - python@3.13
        - ruby
        - rust
      casks:
        - brave-browser
        - claude
        - docker-desktop
        - figma
        - obs
        - slack
        - tailscale-app
        - zoom
      mas: []

    work:
      taps:
        - int128/kubelogin
      brews:
        - autoenv
        - awscli
        - chroma
        - glab
        - helm
        - jira-cli
        - k9s
        - kubernetes-cli
        - int128/kubelogin/kubelogin
        - openshift-cli
        - docker-credential-helper-ecr
        - pgcli
        - ruby
        - rust
      casks:
        - docker-desktop
        - figma
        - obs
      mas: []
