# Claude Code hooks, declared for every machine.
#
# Merged into hooks.<event> in ~/.claude/settings.json by
# private_dot_claude/modify_private_settings.json.tmpl. Same rule as plugins and
# permissions: a declared command is ensured present (matched on the command
# string), hand-added and aix-managed hooks are left alone.
claude_hooks:
  # Ring the bell in Claude's tmux pane when it needs input (Notification) or
  # finishes a turn (Stop). tmux's monitor-bell then flags that window.
  Notification:
    - "$HOME/.tmux/scripts/claude_bell.sh"
  Stop:
    - "$HOME/.tmux/scripts/claude_bell.sh"
