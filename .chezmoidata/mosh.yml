# mosh server exposure on machines that accept inbound SSH.
#
# mosh bootstraps over SSH, then switches to UDP (one port per session in
# 60000-61000). The macOS application firewall is per-APPLICATION, not
# per-port: there is no port list to declare, the binary itself must be
# allowed. A Homebrew mosh-server is only ad-hoc signed, so the firewall will
# not auto-allow it the way it does Developer-ID-signed apps, and the GUI
# "allow incoming connections?" dialog it raises instead can never be answered
# from an SSH session. Symptom without the rule: the SSH bootstrap succeeds,
# mosh-server starts, then the client sits forever on "mosh: Nothing received
# from server on UDP port 600xx. [To quit: Ctrl-^ .]" (mosh never falls back
# to plain SSH; the client just waits for a UDP reply the firewall dropped).
#
# The firewall keys the entry on the binary, not the path string: with the
# symlink entry present, `--add <Cellar path>` prints nothing and adds nothing
# (2026-10-02), so the symlink below is the right target and the health check
# accepts either path in `--listapps`.
#
# The Mini's firewall is not the only place UDP can die, nor the first. The
# tailnet ACL filters per protocol on the receiving node before the macOS
# firewall; on 2026-10-02 it allowed only TCP 22/5900 from the laptop, so SSH
# worked and mosh sat on "Nothing received from server". The ACL lives in the
# Tailscale admin console, not here; docs/REMOTE_ACCESS.md section 0.
mosh:
  # Target of the firewall rule. The Homebrew symlink, not the Cellar path, so
  # the declaration survives `brew upgrade` renaming the Cellar directory.
  server: /opt/homebrew/bin/mosh-server
