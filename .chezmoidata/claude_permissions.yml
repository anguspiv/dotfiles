# Claude Code permission rules, declared for every machine.
#
# Merged into permissions.deny in ~/.claude/settings.json by
# private_dot_claude/modify_private_settings.json.tmpl. Same rule as plugins:
# declared entries are ensured present, hand-added ones are left alone.
#
# These block the Read tool only. A Bash `cat` is a separate permission and is
# not stopped by them, so they are a guard against accidental reads, not a
# sandbox. `**/.env.*` also blocks .env.example; read that through Bash if
# needed.
#
# Edits to ~/.ssh go through the chezmoi source (private_dot_ssh/), which these
# rules do not cover, so blocking reads of the live directory costs nothing.
claude_permissions:
  deny:
    - "Read(**/.env)"
    - "Read(**/.env.*)"
    - "Read(~/.ssh/**)"
    - "Read(~/.aws/**)"
    - "Read(~/.gnupg/**)"
    - "Read(**/*credentials*)"
