# SSH public keys for machines in the fleet, and which of them may log in to
# which profile.
#
# Public halves only. These are public by design - GitHub serves the same bytes
# at https://github.com/anguspiv.keys - so committing them to a public repo
# leaks nothing. The private halves live in Proton Pass and never touch disk.
#
# Keyed by the profile of the machine being logged IN TO, not the machine the
# key belongs to. `personal` lists who may reach the Mac Mini.
#
# Declared here rather than appended to ~/.ssh/authorized_keys by hand, because
# a hand-edited authorized_keys is exactly the "would not survive a rebuild"
# defect this project is cleaning up (Appendix B). Note the consequence:
# ~/.ssh/authorized_keys is now chezmoi-managed, so a key added by hand will be
# removed on the next apply. Add it here instead.
fleet:
  sshAuthorizedKeys:
    # The Mac Mini is the always-on remote target (§7.1). The laptop reaches it
    # over the tailnet on tcp:22.
    personal:
      - comment: "MacBook Pro 16 (light) — Proton Pass, same key as its GitHub auth key"
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICVsQ26p/9AAmuFfBUIfB79ig5FLvG23E1Y+vnwWGwBT angusp@macbookpro16-light"
      # iPad Pro 11 running Blink Shell, over the tailnet. Private half is the
      # Proton Pass item "SSH - iPad Pro 11 (Blink)" in the Personal vault,
      # imported into Blink's keychain by hand (docs/REMOTE_ACCESS.md). Public
      # half fetched with:
      #   pass-cli item view --vault-name Personal \
      #     --item-title "SSH - iPad Pro 11 (Blink)" --field public_key
      - comment: "iPad Pro 11 (Blink Shell) — Proton Pass"
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPbrHqJuLRi1dIZvOTUKL9tAK+0BkDKFzORMRRVVNd4c angusp@ipad-pro-11-blink"
    # Nothing SSHes in to the laptop or the work machine. Remote access is
    # one-directional by design: the laptop is a client, the Mini is the target.
    light: []
    work: []

  # Every machine's SSH commit-signing key. Rendered into
  # ~/.config/git/allowed_signers on SSH-signing machines so `git log
  # --show-signature` verifies commits made on ANY fleet machine, not only the
  # local one. GitHub verifies server-side from the account's Signing Keys and
  # never reads this; each key here must also be registered there as a signing
  # key (the laptop's is id 1201133, the Mini's 1202606).
  #
  # Not keyed by profile, unlike sshAuthorizedKeys: trusting a signature is not
  # granting a login. `email` is the principal - the committer email the key
  # signs as - because that is what git matches a signature against.
  sshSigningKeys:
    - comment: "Work MacBook Pro (FNVF299JMC) — Proton Pass"
      email: "angus.perkerson@disney.com"
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIATugtZ9K7IVuBTZPhQS+J8C7ZG2fMpy2WVi8TmnzDp+"
    - comment: "MacBook Pro 16 (light) — Proton Pass"
      email: "angusp@angusp.com"
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICVsQ26p/9AAmuFfBUIfB79ig5FLvG23E1Y+vnwWGwBT"
    - comment: "Mac Mini M4 (personal) — Proton Pass"
      email: "angusp@angusp.com"
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHCUYFvgFe1B/xWnIngZydGEILzI4iTj1dfnTEwHaCpf"
