# Claude Code environment variables, declared for every machine.
#
# Merged into env in ~/.claude/settings.json by
# private_dot_claude/modify_private_settings.json.tmpl. Declared keys win;
# aix-managed keys (OTEL_*, telemetry) and hand-added ones are left alone.
claude_env:
  # Leave the terminal title to peon-ping. Claude's own "✳ <task>" title
  # overwrote peon-ping's "<project>: working|needs approval|done" and never
  # changed while busy, so tmux's agent_status.sh showed busy and blocked
  # panes as idle. Cost: Ghostty tabs show "project: state", not the task.
  CLAUDE_CODE_DISABLE_TERMINAL_TITLE: "1"
